name: Build Kryvex Client

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract source
        run: |
          mkdir source
          unzip -o Kryvex-Client-1.21.4-source2.zip -d source

      - name: Find project
        run: |
          FILE=$(find source -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) | head -n 1)
          if [ -z "$FILE" ]; then
            echo "Error: build.gradle not found!"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$FILE")" >> $GITHUB_ENV

      - name: Fix KryvexScreen code
        run: |
          SCREEN_FILE=$(find source -name "KryvexScreen.java" | head -n 1)
          if [ -n "$SCREEN_FILE" ]; then
            echo "Fixing $SCREEN_FILE"
            sed -i 's/renderBackground(ctx);/this.renderBackground(ctx, mouseX, mouseY, delta);/g' "$SCREEN_FILE"
          fi

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Fix Gradle repositories
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          
          base_dir = os.environ.get("PROJECT_DIR", "source")
          for p in Path(base_dir).rglob("*settings.gradle*"):
              if p.is_file():
                  lines = p.read_text().splitlines()
                  new_lines = [line for line in lines if "FAIL_ON_PROJECT_REPOS" not in line]
                  if lines != new_lines:
                      p.write_text("\n".join(new_lines))
          PY

      - name: Build
        run: |
          cd "$PROJECT_DIR"
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew build
          else
            gradle build
          fi

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: my-app-jar
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar
