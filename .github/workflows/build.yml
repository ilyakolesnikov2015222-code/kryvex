
name: Build Kryvex Client

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract source
        run: |
          mkdir source
          unzip -o Kryvex-Client-1.21.4-source.zip -d source

      - name: Find project
        run: |
          FILE=$(find source -type f \( -name build.gradle -o -name build.gradle.kts \) | head -n 1)
          echo "PROJECT_DIR=$(dirname "$FILE")" >> $GITHUB_ENV
          test -n "$FILE"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build
        run: |
          cd "$PROJECT_DIR"
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew build
          else
            gradle build
          fi

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Kryvex-Client-JAR
          path: source/**/build/libs/*.jar
          if-no-files-found: error
          
